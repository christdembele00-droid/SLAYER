services:
  - type: web
    name: slayer-api
    runtime: python
    plan: free
    region: frankfurt
    autoDeploy: true
    buildCommand: pip install -r server/requirements.txt
    startCommand: uvicorn server.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SLAYER_ENV
        value: production
      - key: SLAYER_ALLOWED_ORIGINS
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false

  - type: web
    name: slayer-web
    runtime: static
    plan: free
    region: frankfurt
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: SLAYER_FETCH_WEB_ASSETS
        value: "0"
