name: SLAYER Android Release
on:
  workflow_dispatch:
    inputs:
      version_name: {required: true, default: "0.1.0", type: string}
jobs:
 build:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-node@v4
     with: {node-version: 20}
   - uses: actions/setup-java@v4
     with: {distribution: temurin, java-version: "21"}
   - run: npm install
   - run: npm install @capacitor/core @capacitor/cli @capacitor/android
   - run: npm run build
   - run: npx cap add android
   - run: npx cap sync android
   - name: Decode signing key
     if: ${{ secrets.SLAYER_KEYSTORE_B64 != '' }}
     env: {KEY_B64: ${{ secrets.SLAYER_KEYSTORE_B64 }}}
     run: echo "$KEY_B64" | base64 --decode > slayer-release.keystore
   - name: Build signed AAB
     if: ${{ secrets.SLAYER_KEYSTORE_B64 != '' }}
     env:
      KEYSTORE_PATH: ${{ github.workspace }}/slayer-release.keystore
      KEYSTORE_PASSWORD: ${{ secrets.SLAYER_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.SLAYER_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.SLAYER_KEY_PASSWORD }}
     run: |
      cd android
      chmod +x gradlew
      ./gradlew bundleRelease
   - uses: actions/upload-artifact@v4
     if: ${{ secrets.SLAYER_KEYSTORE_B64 != '' }}
     with:
      name: SLAYER-AAB-${{ inputs.version_name }}
      path: android/app/build/outputs/bundle/release/*.aab
