name: SLAYER Android Release
on:
  workflow_dispatch:
    inputs:
      version_name: {required: true, default: "0.1.0", type: string}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "21"}
      - run: npm install
      - run: npm install @capacitor/core @capacitor/cli @capacitor/android
      - run: npm run build
      - run: npx cap add android
      - run: npx cap sync android
      - name: Build Android debug APK and release AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: SLAYER-Android-${{ inputs.version_name }}
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
