name: SLAYER CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - run: npm run test -- --run

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r server/requirements.txt
      - run: python -m compileall server
      - run: python -m unittest server/test_matchmaking.py

  android:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm install
      - run: npm install @capacitor/core @capacitor/cli @capacitor/android
      - run: npm run build
      - run: npx cap add android
      - run: npx cap sync android
      - name: Build Android debug APK and release AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: SLAYER-Android-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab

  filament:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.1.0"
      - name: Download Filament 1.77 Android native distribution
        run: |
          curl -L --fail --retry 3 -o /tmp/filament-native.tgz https://github.com/google/filament/releases/download/v1.77.0/filament-v1.77.0-android-native.tgz
          mkdir -p /tmp/filament-native
          tar -xzf /tmp/filament-native.tgz -C /tmp/filament-native
          echo "FILAMENT_DIST_DIR=/tmp/filament-native" >> "$GITHUB_ENV"
      - name: Stage Filament ubershader archive
        run: |
          set -euo pipefail
          mkdir -p benchmarks/filament-v0.1/android/app/src/main/assets/filament
          UBERZ="$(find /tmp/filament-native -type f -name '*.uberz' | head -n 1 || true)"
          if [ -n "$UBERZ" ]; then
            echo "Using packaged ubershader archive: $UBERZ"
            cp "$UBERZ" benchmarks/filament-v0.1/android/app/src/main/assets/filament/default.uberz
            exit 0
          fi

          # The Android native distribution ships the generated ubershader as
          # materials/uberarchive.h rather than as a standalone .uberz file.
          # Reconstruct the exact binary archive from UBERARCHIVE_DEFAULT_DATA.
          HEADER="$(find /tmp/filament-native -type f -path '*/include/gltfio/materials/uberarchive.h' | head -n 1 || true)"
          if [ -z "$HEADER" ]; then
            echo "No packaged .uberz and no generated uberarchive.h found"
            find /tmp/filament-native -maxdepth 6 -type f | grep -E 'uber|gltfio' | head -n 120 || true
            exit 1
          fi

          python3 - "$HEADER" benchmarks/filament-v0.1/android/app/src/main/assets/filament/default.uberz <<'PY'
          import re
          import sys
          from pathlib import Path

          header = Path(sys.argv[1]).read_text(encoding="utf-8")
          output = Path(sys.argv[2])

          match = re.search(
              r'UBERARCHIVE_DEFAULT_DATA\s*\[[^\]]*\]\s*=\s*\{(.*?)\};',
              header,
              re.DOTALL,
          )
          if not match:
              raise SystemExit("Could not locate UBERARCHIVE_DEFAULT_DATA in uberarchive.h")

          body = re.sub(r'/\*.*?\*/|//[^\n]*', '', match.group(1), flags=re.DOTALL)
          tokens = re.findall(r'0[xX][0-9a-fA-F]{1,2}', body)
          if not tokens:
              raise SystemExit("UBERARCHIVE_DEFAULT_DATA contains no hexadecimal byte data")

          data = bytes(int(token, 16) for token in tokens)

          size_match = re.search(r'UBERARCHIVE_DEFAULT_SIZE\s*=\s*(\d+)', header)
          if size_match:
              expected = int(size_match.group(1))
              if expected != len(data):
                  raise SystemExit(
                      f"Ubershader size mismatch: header={expected}, parsed={len(data)}"
                  )

          output.write_bytes(data)
          print(f"Reconstructed ubershader archive: {output} ({len(data)} bytes)")
          PY
      - name: Build native Filament benchmark APK
        run: gradle -p benchmarks/filament-v0.1/android assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SLAYER-Filament-V0.1-${{ github.sha }}
          path: benchmarks/filament-v0.1/android/app/build/outputs/apk/debug/*.apk
