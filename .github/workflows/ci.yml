name: SLAYER CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - run: npm run test -- --run

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r server/requirements.txt
      - run: python -m compileall server
      - run: python -m unittest server/test_matchmaking.py

  android:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm install
      - run: npm install @capacitor/core @capacitor/cli @capacitor/android
      - run: npm run build
      - run: npx cap add android
      - run: npx cap sync android
      - name: Build Android debug APK and release AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: SLAYER-Android-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab

  filament:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.1.0"
      - name: Download Filament 1.77 Android native distribution
        run: |
          curl -L --fail --retry 3 -o /tmp/filament-native.tgz https://github.com/google/filament/releases/download/v1.77.0/filament-v1.77.0-android-native.tgz
          mkdir -p /tmp/filament-native
          tar -xzf /tmp/filament-native.tgz -C /tmp/filament-native
          echo "FILAMENT_DIST_DIR=/tmp/filament-native" >> "$GITHUB_ENV"
      - name: Download Filament 1.77 host tools
        run: |
          curl -L --fail --retry 3 -o /tmp/filament-host.tgz https://github.com/google/filament/releases/download/v1.77.0/filament-v1.77.0-linux.tgz
          mkdir -p /tmp/filament-host
          tar -xzf /tmp/filament-host.tgz -C /tmp/filament-host
          MATC="$(find /tmp/filament-host -type f -name matc -perm -111 | head -n 1)"
          test -n "$MATC"
          echo "MATC=$MATC" >> "$GITHUB_ENV"
          "$MATC" --version
      - name: Compile SLAYER terrain material
        run: |
          mkdir -p benchmarks/filament-v0.1/android/app/src/main/assets/materials
          "$MATC" -p mobile -a opengl -a vulkan -S             -o benchmarks/filament-v0.1/android/app/src/main/assets/materials/grass.filamat             benchmarks/filament-v0.1/materials/grass.mat
      - name: Build native Filament benchmark APK
        run: gradle -p benchmarks/filament-v0.1/android assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SLAYER-Filament-V0.1-${{ github.sha }}
          path: benchmarks/filament-v0.1/android/app/build/outputs/apk/debug/*.apk
