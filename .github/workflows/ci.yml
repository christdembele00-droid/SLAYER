name: SLAYER CI
on:\n  push:\n    branches: [main]\n  pull_request:\n  workflow_dispatch:
jobs:
 web:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-node@v4
     with: {node-version: 20}
   - run: npm install
   - run: npm run build
   - run: npm run test -- --run
 server:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-python@v5
     with: {python-version: "3.12"}
   - run: pip install -r server/requirements.txt
   - run: python -m compileall server
   - run: python -m unittest server/test_matchmaking.py
 android:
  needs: web
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-node@v4
     with: {node-version: 20}
   - uses: actions/setup-java@v4
     with: {distribution: temurin, java-version: "21"}
   - run: npm install
   - run: npm install @capacitor/core @capacitor/cli @capacitor/android
   - run: npm run build
   - run: npx cap add android
   - run: npx cap sync android
   - name: Build Android debug APK and release AAB
     run: |
      cd android
      chmod +x gradlew
      ./gradlew assembleDebug bundleRelease
   - uses: actions/upload-artifact@v4
     with:
      name: SLAYER-Android-${GITHUB_SHA}
      path: |
       android/app/build/outputs/apk/debug/*.apk
       android/app/build/outputs/bundle/release/*.aab

 filament:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-java@v4
     with:
      distribution: temurin
      java-version: "21"
   - name: Check Gradle
     run: gradle --version
   - name: Build native Filament benchmark APK
     run: gradle -p benchmarks/filament-v0.1/android assembleDebug --no-daemon
   - uses: actions/upload-artifact@v4
     with:
      name: SLAYER-Filament-V0.1-${GITHUB_SHA}
      path: benchmarks/filament-v0.1/android/app/build/outputs/apk/debug/*.apk
