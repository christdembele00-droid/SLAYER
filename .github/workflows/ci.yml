name: SLAYER CI
run-name: SLAYER CI • ${{ github.event_name }} • ${{ github.sha }}
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
permissions: { contents: read }

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: git diff --check
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - run: npm install
      - run: npm audit --audit-level=moderate
      - run: npm run build
      - run: npm run test -- --run

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r server/requirements.txt
      - run: python -m compileall server
      - run: docker build -f server/Dockerfile .
      - run: python -m unittest discover -s . -p "test_*.py" -t .

  filament:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: git diff --check
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "9.1.0" }
      - run: mkdir -p /tmp/slayer-toolchain
      - uses: actions/cache@v4
        with:
          path: /tmp/slayer-toolchain
          key: slayer-filament-${{ runner.os }}-1.77.0-v3
      - name: Download and verify pinned Filament
        env:
          FILAMENT_VERSION: "1.77.0"
          FILAMENT_NATIVE_SHA256: "efe986a27b66ed465e7cfc9e7d485f6d602ba1a1411897bf1653be82da581e63"
          FILAMENT_LINUX_SHA256: "d109cb177f55968abc52afd8ba338dade935e3506dd8e7efe5721c3208fd468a"
        run: |
          set -euo pipefail
          native="/tmp/slayer-toolchain/filament-v${FILAMENT_VERSION}-android-native.tgz"
          linux="/tmp/slayer-toolchain/filament-v${FILAMENT_VERSION}-linux.tgz"
          test -s "$native" || curl -L --fail --retry 5 --retry-all-errors -o "$native" "https://github.com/google/filament/releases/download/v${FILAMENT_VERSION}/filament-v${FILAMENT_VERSION}-android-native.tgz"
          test -s "$linux" || curl -L --fail --retry 5 --retry-all-errors -o "$linux" "https://github.com/google/filament/releases/download/v${FILAMENT_VERSION}/filament-v${FILAMENT_VERSION}-linux.tgz"
          echo "${FILAMENT_NATIVE_SHA256}  ${native}" | sha256sum -c -
          echo "${FILAMENT_LINUX_SHA256}  ${linux}" | sha256sum -c -
          rm -rf /tmp/filament-native /tmp/filament-linux
          mkdir -p /tmp/filament-native /tmp/filament-linux
          tar -xzf "$native" -C /tmp/filament-native
          tar -xzf "$linux" -C /tmp/filament-linux
          cmgen="$(find /tmp/filament-linux -type f -name cmgen -perm -111 | head -n 1)"
          matc="$(find /tmp/filament-linux -type f -name matc -perm -111 | head -n 1)"
          gltfpack="$(find /tmp/filament-linux -type f -name gltfpack -perm -111 | head -n 1)"
          test -n "$cmgen" && test -n "$matc" && test -n "$gltfpack"
          echo "FILAMENT_DIST_DIR=/tmp/filament-native" >> "$GITHUB_ENV"
          echo "FILAMENT_TOOLS_DIR=$(dirname "$cmgen")" >> "$GITHUB_ENV"
      - run: sudo apt-get update && sudo apt-get install -y blender unzip python3-numpy
      - run: node scripts/validate-android-configuration.mjs
      - run: node scripts/prepare-filament-production-assets.mjs
      - run: node scripts/validate-filament-production-assets.mjs
      - run: gradle -p engine/filament/android assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SLAYER-Native-Debug-${{ github.sha }}
          path: |
            engine/filament/android/app/build/outputs/apk/debug/*.apk
            engine/filament/android/app/src/main/assets/slayer-production-assets.json

  release-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: '! grep -R --line-number --fixed-strings "assembleRelease" .github/workflows/ci.yml && grep -R --line-number --fixed-strings "bundleRelease" .github/workflows/android-release.yml'
