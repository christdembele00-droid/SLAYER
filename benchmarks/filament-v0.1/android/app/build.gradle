plugins {
    id "com.android.application"
    id "com.google.gms.google-services"
}

def slayerVersionCode = (System.getenv("VERSION_CODE") ?: "1").toInteger()
def slayerVersionName = System.getenv("VERSION_NAME") ?: "0.1.0"
def slayerApiUrl = System.getenv("SLAYER_API_URL") ?: ""


android {
    namespace "com.slayer.filament"
    compileSdk 37
    ndkVersion "29.0.14206865"

    defaultConfig {
        applicationId "com.slayer.filament"
        minSdk 24
        targetSdk 37

        buildConfigField "String", "SLAYER_API_URL", "\"" + slayerApiUrl + "\""
        versionCode slayerVersionCode
        versionName slayerVersionName

        ndk { abiFilters "arm64-v8a" }

        externalNativeBuild {
            cmake {
                arguments "-DFILAMENT_DIST_DIR=${System.getenv("FILAMENT_DIST_DIR") ?: ""}"
                cppFlags "-std=c++20"
            }
        }
    }

    // This module contains Java + native C++, not Kotlin.
    // AGP 9 enables built-in Kotlin by default; disable it explicitly.
    enableKotlin = false

    def releaseKeystore = System.getenv("SLAYER_KEYSTORE_PATH")
    signingConfigs {
        release {
            if (releaseKeystore) {
                storeFile file(releaseKeystore)
                storePassword System.getenv("SLAYER_KEYSTORE_PASSWORD")
                keyAlias System.getenv("SLAYER_KEY_ALIAS")
                keyPassword System.getenv("SLAYER_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            signingConfig releaseKeystore ? signingConfigs.release : null
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    externalNativeBuild {
        cmake {
            path "../../native/CMakeLists.txt"
            version "3.22.1"
        }
    }
}

dependencies {
    implementation "com.google.android.filament:filament-android:1.77.0"
    implementation "com.google.android.filament:gltfio-android:1.77.0"
    implementation "com.android.billingclient:billing:9.1.0"

    // Firebase Auth is the identity layer; match state never travels through Firebase.
    implementation platform("com.google.firebase:firebase-bom:34.19.0")
    implementation "com.google.firebase:firebase-auth"
}
