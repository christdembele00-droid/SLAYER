plugins { id "com.android.application" }

android {
    namespace "com.slayer.filament"
    compileSdk 37
    ndkVersion "29.0.14206865"

    defaultConfig {
        applicationId "com.slayer.filament"
        minSdk 24
        targetSdk 37
        versionCode 1
        versionName "0.1.0"
        ndk { abiFilters "arm64-v8a" }
        externalNativeBuild {
            cmake {
                arguments "-DFILAMENT_DIST_DIR=${System.getenv("FILAMENT_DIST_DIR") ?: ""}"
                cppFlags "-std=c++20"
            }
        }
    }

    // This module is Java-only. AGP 9 enables built-in Kotlin by default; disable it here\n    // so Filament's Kotlin metadata does not force an unrelated Kotlin compile task.\n    enableKotlin = false\n\n    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    externalNativeBuild {
        cmake {
            path "../../native/CMakeLists.txt"
            version "3.22.1"
        }
    }
}

dependencies {
    implementation "com.google.android.filament:filament-android:1.77.0"
    implementation "com.google.android.filament:gltfio-android:1.77.0"
    implementation "com.google.android.filament:filament-utils-android:1.77.0"
}
